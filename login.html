<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Smart Year 3 - Maklumat Murid</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #4b6cb7 0%, #182848 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            text-align: center;
        }
        .icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 5px;
        }
        p {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 16px;
            outline: none;
        }
        input:focus, select:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.5);
        }
        .btn-start {
            width: 100%;
            padding: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-start:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">📚</div>
        <h2>Get Smart Year 3</h2>
        <p>Sila masukkan nama dan kelas anda untuk Mula</p>

        <form id="studentForm" onsubmit="saveAndRedirect(event)">
            <div class="form-group">
                <label for="studentName">👤 Nama Murid:</label>
                <input type="text" id="studentName" placeholder="Contoh: Muhammad Ali" required>
            </div>

            <div class="form-group">
                <label for="studentClass">🏫 Kelas:</label>
                <input type="text" id="studentClass" placeholder="Contoh: 3 Cerdik" required>
            </div>

            <button type="submit" class="btn-start">Mula Latihan 🚀</button>
        </form>
    </div>

    <script>
        function saveAndRedirect(event) {
            event.preventDefault();
            
            // Simpan nama dan kelas murid dalam localStorage
            const name = document.getElementById('studentName').value;
            const studentClass = document.getElementById('studentClass').value;
            
            localStorage.setItem('studentName', name);
            localStorage.setItem('studentClass', studentClass);

            // Bawa murid ke halaman soalan/modul utama (tukar 'index.html' mengikut nama fail utama anda jika berbeza)
            window.location.href = 'index.html'; 
        }
    </script>

</body>
</html>
