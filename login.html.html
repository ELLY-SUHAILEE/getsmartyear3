<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEQS Admin - Professional Login</title>
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div id="toast-container" class="toast-container"></div>
  <div class="login-container">
    <div class="login-card">
      <div class="brand-header">
        <div class="brand-logo">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <h2>SEQS EduPortal</h2>
        <p>Educational Management System</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="input-group">
          <label for="username">Username</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Enter username" required autocomplete="username">
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Enter password" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <div class="login-footer">
        <p>Default Access: <strong>admin</strong> / <strong>admin123</strong></p>
      </div>
    </div>
  </div>
  <script src="login.js"></script>
</body>
</html>
